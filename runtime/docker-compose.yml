name: araru-runtime

services:
  postgres:
    image: postgres:16-alpine
    hostname: araru-postgres
    container_name: araru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-araru}
      POSTGRES_USER: ${POSTGRES_USER:-araru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo runtime/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    hostname: araru-redis
    container_name: araru-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: araru-server:${ARARU_SERVER_VERSION:-local}
    hostname: araru-server
    container_name: araru-server
    build:
      context: ${ARARU_WORKSPACE_ROOT:-../..}
      dockerfile: ${ARARU_RUNTIME_DOCKERFILE:-araruoss/runtime/Dockerfile}
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-araru}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-araru}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      ALLOWED_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:8080}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3001}
      LOCAL_LIBRARY_DIR: /app/storage/pdfs
      DATA_DIR: /app/storage
      COVER_CACHE_DIR: /app/storage/cache/covers
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      ENABLE_GOOGLE_DRIVE: ${ENABLE_GOOGLE_DRIVE:-false}
      APP_ACCESS_SECRET: ${APP_ACCESS_SECRET:-}
    volumes:
      - ./storage:/app/storage
    ports:
      - "${ARARU_SERVER_PORT:-3001}:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: araru-web:${ARARU_WEB_VERSION:-local}
    hostname: araru-web
    container_name: araru-web
    build:
      context: ${ARARU_WORKSPACE_ROOT:-../..}
      dockerfile: ${ARARU_RUNTIME_DOCKERFILE:-araruoss/runtime/Dockerfile}
      target: web
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://server:3001
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    ports:
      - "${ARARU_WEB_PORT:-8080}:80"
    depends_on:
      server: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
